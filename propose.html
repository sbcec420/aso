<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💖 Love Question 💖</title>
    <style>
        /* কাস্টম ফন্ট */
        @font-face {
            font-family: 'Sabir2';
            src: url('সাবির ২ UNICODE.ttf');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- Meesho স্টাইল লোডিং সেকশন --- */
        #loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .meesho-m-loader {
            width: 70px; 
            height: 70px;
            overflow: visible;
        }

        .m-path {
            fill: none;
            stroke-width: 12px;
            stroke-linecap: round;
        }

        .bg-path {
            stroke: #f3e5f5; /* হালকা বেগুনি */
        }

        .anim-path {
            stroke: #9c27b0; /* Meesho Purple */
            stroke-dasharray: 600;
            stroke-dashoffset: 600;
            animation: draw-and-erase 2.5s ease-in-out infinite;
        }

        @keyframes draw-and-erase {
            0% { stroke-dashoffset: 600; }
            45% { stroke-dashoffset: 0; }
            55% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: -600; }
        }

        .loader-text {
            margin-top: 15px;
            font-family: sans-serif;
            color: #777; /* হালকা ধূসর রঙ */
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* --- মেইন কন্টেন্ট স্টাইল --- */
        body {
            height: 100vh;
            width: 100vw;
            background: linear-gradient(135deg, #f2dada 0%, #fce4ec 100%);
            font-family: 'Sabir2', 'Hind Siliguri', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 30px 20px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            z-index: 10;
            border: 3px solid #ff9800;
            opacity: 0; 
            transform: translateY(20px);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .container.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* ... বাকি সব স্টাইল আগের মতোই থাকবে ... */
        .gif-container { height: 160px; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; }
        .gif-container img { max-width: 180px; max-height: 160px; border-radius: 20px; object-fit: contain; }
        h2 { color: #556b2f; font-size: 1.1rem; margin-bottom: 5px; }
        #question-text { font-size: 1.6rem; font-weight: bold; color: #ff1493; margin: 15px 0; min-height: 70px; }
        .btn-group { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 10px; height: 60px; }
        .btn { padding: 12px 35px; font-size: 1.2rem; border-radius: 50px; border: none; cursor: pointer; font-family: inherit; font-weight: bold; transition: all 0.3s ease; }
        .yes-btn { background: linear-gradient(45deg, #ff4d8d, #ff1493); color: white; box-shadow: 0 4px 15px rgba(255, 20, 147, 0.3); }
        #no-btn { background: white; color: #ff4d8d; border: 2px solid #ff4d8d; }
    </style>
</head>
<body>

    <div id="loader-wrapper">
        <svg class="meesho-m-loader" viewBox="0 0 100 100">
            <path class="m-path bg-path" d="M 15 90 V 40 C 15 10, 40 10, 40 40 V 90 V 40 C 40 10, 65 10, 65 40 V 90" />
            <path class="m-path anim-path" d="M 15 90 V 40 C 15 10, 40 10, 40 40 V 90 V 40 C 40 10, 65 10, 65 40 V 90" />
        </svg>
        <div class="loader-text">Please wait...</div>
    </div>

    <div class="container" id="main-card">
        <h2>এই product টি order করার জন্য একটা প্রশ্নের উত্তর দাও -</h2>
        <div class="gif-container">
            <img id="main-gif" src="emm-thinking.gif" alt="Thinking...">
        </div>

        <div id="question-text">তুমি কি আমাকে ভালোবাসো? ❤️</div>

        <div class="btn-group">
            <button class="yes-btn btn" onclick="goToNext()">Yes</button>
            <button id="no-btn" class="btn">No</button>
        </div>
    </div>

    <audio id="bg-song" src="dil-mera-tute-geya-hey.mp3" preload="auto"></audio>

<script>
    const loader = document.getElementById("loader-wrapper");
    const mainCard = document.getElementById("main-card");
    const noBtn = document.getElementById("no-btn");
    const mainGif = document.getElementById("main-gif");
    const questionMsg = document.getElementById("question-text");
    const audio = document.getElementById("bg-song");

    let count = 0;
    let isMovingMode = false;
    const colors = ["#ff0000", "#ff8c00", "#00008b", "#008080", "#800080"];

    const stages = [
        { gif: "thinking.gif", msg: "এতো তাড়াতাড়ি উত্তর দিচ্ছো একটু ভেবে বলো 🥺" },
        { gif: "mochi-mochi-peach-cat.gif", msg: "নাও তোমায় আদর করছি এবার বলে দাও 😔" },
        { gif: "fan-relax.gif", msg: "একটু মাথা ঠান্ডা করে উত্তর দাও" },
        { gif: "peach-goma-phone.gif", msg: "আমি তোমার খুবই CARE করবো 👩‍❤️‍👨" },
        { gif: "puszi.gif", msg: "কেন এমন করছো তুমি? Yes বলে দাও plz... 😫" },
        { gif: "couple-forgive-me.gif", msg: "বেবি মেনে যাও না! 😭 হাত জোড় করছি 🙏" },
        { gif: "flower.gif", msg: "LAST বারের মতো বলছি ACCEPT করো 😡" }
    ];

    // --- স্মার্ট লোডিং লজিক (পার্সেন্টেজ ছাড়া) ---
    function hideLoader() {
        loader.style.opacity = "0";
        loader.style.visibility = "hidden";
        mainCard.classList.add("show");
    }

    window.onload = () => {
        const imagesToLoad = stages.map(s => s.gif);
        imagesToLoad.push("emm-thinking.gif");

        let loadedCount = 0;
        const totalImages = imagesToLoad.length;

        if (totalImages === 0) {
            hideLoader();
        } else {
            imagesToLoad.forEach(src => {
                const img = new Image();
                img.src = src;
                img.onload = img.onerror = () => {
                    loadedCount++;
                    // এখানে আর টেক্সট আপডেট হবে না, শুধু কাউন্ট হবে
                    if (loadedCount === totalImages) {
                        setTimeout(hideLoader, 800); // ৮০০ মিলিসেকেন্ড পর লোডার সরবে
                    }
                };
            });
        }
    };

    // বাটন পালানোর লজিক এবং বাকি সব
    function teleportButton() {
        if (!isMovingMode) return;
        noBtn.style.position = "fixed";
        const margin = 50; 
        const maxX = window.innerWidth - noBtn.offsetWidth - margin;
        const maxY = window.innerHeight - noBtn.offsetHeight - margin;
        noBtn.style.left = Math.max(margin, Math.random() * maxX) + "px";
        noBtn.style.top = Math.max(margin, Math.random() * maxY) + "px";
    }

    noBtn.addEventListener("click", () => {
        if (isMovingMode) { teleportButton(); return; }
        audio.play().catch(() => {});
        questionMsg.style.color = colors[Math.floor(Math.random() * colors.length)];
        if (count < stages.length) {
            mainGif.src = stages[count].gif;
            questionMsg.innerText = stages[count].msg;
            count++;
        } else {
            isMovingMode = true;
            questionMsg.innerText = "এবার তো 'Yes' বলতেই হবে! 😜";
            teleportButton();
        }
    });

    noBtn.addEventListener("mouseover", teleportButton);
    noBtn.addEventListener("touchstart", (e) => {
        if (isMovingMode) { e.preventDefault(); teleportButton(); }
    });

    function goToNext() {
        audio.pause();
        window.location.href = "speak.html";
    }
</script>
</body>
</html>
