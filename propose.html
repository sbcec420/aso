<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💖 Love Question 💖</title>
    <style>
        /* কাস্টম ফন্ট */
        @font-face {
            font-family: 'Sabir2';
            src: url('সাবির ২ UNICODE.ttf');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            height: 100vh;
            width: 100vw;
            background: linear-gradient(135deg, #f2dada 0%, #fce4ec 100%);
            font-family: 'Sabir2', 'Hind Siliguri', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 30px 20px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            z-index: 10;
            border: 3px solid #ff9800; /* Orange Border */
        }

        .gif-container {
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .gif-container img {
            max-width: 180px;
            max-height: 160px;
            border-radius: 20px;
            object-fit: contain;
        }

        h2 {
            color: #556b2f;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        #question-text {
            font-size: 1.6rem;
            font-weight: bold;
            color: #ff1493;
            margin: 15px 0;
            min-height: 70px;
            transition: color 0.3s ease;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 10px;
            height: 60px;
        }

        .btn {
            padding: 12px 35px;
            font-size: 1.2rem;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* Yes Button - Attractive Gradient */
        .yes-btn {
            background: linear-gradient(45deg, #ff4d8d, #ff1493);
            color: white;
        }

        .yes-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(255, 20, 147, 0.4);
        }

        /* No Button - Outlined */
        #no-btn {
            background: white;
            color: #ff4d8d;
            border: 2px solid #ff4d8d;
            position: relative;
        }
    </style>
</head>
<body>

    <div class="container" id="main-card">
        <h2>এই product টি order করার জন্য একটা প্রশ্নের উত্তর দাও -</h2>
        <div class="gif-container">
            <img id="main-gif" src="emm-thinking.gif" alt="Thinking...">
        </div>

        <div id="question-text">তুমি কি আমাকে ভালোবাসো? ❤️</div>

        <div class="btn-group">
            <button class="yes-btn btn" onclick="goToNext()">Yes</button>
            <button id="no-btn" class="btn">No</button>
        </div>
    </div>

    <audio id="bg-song" src="dil-mera-tute-geya-hey.mp3" preload="auto"></audio>

<script>
    const noBtn = document.getElementById("no-btn");
    const mainGif = document.getElementById("main-gif");
    const questionMsg = document.getElementById("question-text");
    const audio = document.getElementById("bg-song");

    let count = 0;
    let isMovingMode = false;
    const colors = ["#ff0000", "#ff8c00", "#00008b", "#008080", "#800080"];

    const stages = [
        { gif: "thinking.gif", msg: "এতো তাড়াতাড়ি উত্তর দিচ্ছো একটু ভেবে বলো 🥺" },
        { gif: "mochi-mochi-peach-cat.gif", msg: "নাও তোমায় আদর করছি এবার বলে দাও 😔" },
        { gif: "fan-relax.gif", msg: "একটু মাথা ঠান্ডা করে উত্তর দাও" },
        { gif: "peach-goma-phone.gif", msg: "আমি তোমার খুবই CARE করবো 👩‍❤️‍👨" },
        { gif: "puszi.gif", msg: "কেন এমন করছো তুমি? Yes বলে দাও plz... 😫" },
        { gif: "couple-forgive-me.gif", msg: "বেবি মেনে যাও না! 😭 হাত জোড় করছি 🙏" },
        { gif: "flower.gif", msg: "LAST বারের মতো বলছি ACCEPT করো 😡" }
    ];

    // --- প্রি-লোডিং লজিক (স্পিড বাড়ানোর জন্য) ---
    window.onload = () => {
        const imagesToPreload = stages.map(s => s.gif);
        imagesToPreload.push("emm-thinking.gif");
        
        imagesToPreload.forEach(src => {
            const img = new Image();
            img.src = src;
        });
    };

    function teleportButton() {
        if (!isMovingMode) return;

        noBtn.style.position = "fixed";
        const btnWidth = noBtn.offsetWidth;
        const btnHeight = noBtn.offsetHeight;
        
        const margin = 50; 
        const maxX = window.innerWidth - btnWidth - margin;
        const maxY = window.innerHeight - btnHeight - margin;

        const randomX = Math.max(margin, Math.random() * maxX);
        const randomY = Math.max(margin, Math.random() * maxY);

        noBtn.style.left = randomX + "px";
        noBtn.style.top = randomY + "px";
    }

    noBtn.addEventListener("click", (e) => {
        if (isMovingMode) {
            teleportButton();
            return;
        }

        // প্রথম ক্লিকেই গান শুরু হবে
        audio.play().catch(() => {});

        // টেক্সট কালার পরিবর্তন
        questionMsg.style.color = colors[Math.floor(Math.random() * colors.length)];

        if (count < stages.length) {
            mainGif.src = stages[count].gif;
            questionMsg.innerText = stages[count].msg;
            count++;
        } else {
            // সব স্টেজ শেষ হলে বাটন পালানো শুরু করবে
            isMovingMode = true;
            questionMsg.innerText = "এবার তো 'Yes' বলতেই হবে! 😜";
            teleportButton();
        }
    });

    // মাউস এবং টাচ ইভেন্ট
    noBtn.addEventListener("mouseover", teleportButton);
    noBtn.addEventListener("touchstart", (e) => {
        if (isMovingMode) {
            e.preventDefault();
            teleportButton();
        }
    });

    function goToNext() {
        audio.pause();
        window.location.href = "speak.html";
    }
</script>
</body>
</html>
